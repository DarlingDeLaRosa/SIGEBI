<article class="report-card" [attr.aria-labelledby]="'report-title-' + report().id">
  <div class="card-heading">
    <span [class]="'report-icon tone-' + report().tone">
      <i [class]="'bi ' + report().icon" aria-hidden="true"></i>
    </span>
    <span class="category">{{ report().category }}</span>
  </div>
  <h3 [id]="'report-title-' + report().id">{{ report().title }}</h3>
  <p class="report-description">{{ report().description }}</p>
  <ul class="highlights" aria-label="Contenido del reporte">
    @for (highlight of report().highlights; track highlight) {
      <li><i class="bi bi-check2" aria-hidden="true"></i>{{ highlight }}</li>
    }
  </ul>
  <p class="report-note"><i class="bi bi-info-circle" aria-hidden="true"></i>{{ report().note }}</p>
  <div class="card-actions">
    <button
      type="button"
      class="view-button"
      [disabled]="disabled()"
      [attr.aria-label]="'Ver ' + report().title"
      (click)="view.emit(report())"
    >
      <i class="bi bi-eye" aria-hidden="true"></i>Ver reporte
    </button>
    <button
      type="button"
      class="download-button"
      [disabled]="disabled()"
      [attr.aria-label]="'Descargar ' + report().title"
      (click)="download.emit(report())"
    >
      <i class="bi bi-download" aria-hidden="true"></i>Descargar
    </button>
    @if (report().printable) {
      <button
        type="button"
        class="print-button"
        [disabled]="disabled()"
        [attr.aria-label]="'Imprimir ' + report().title"
        title="Imprimir formulario"
        (click)="print.emit(report())"
      >
        <i class="bi bi-printer" aria-hidden="true"></i>
      </button>
    }
  </div>
</article>
