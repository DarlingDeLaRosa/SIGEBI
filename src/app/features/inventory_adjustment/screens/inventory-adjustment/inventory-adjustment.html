<div class="title">
  <h1>Conciliaciones de inventario</h1>
  <div class="d-flex gap-2 flex-wrap">
    <button type="button" class="btn navigate" (click)="toggleFilters()">
      {{ showFilters() ? 'Ocultar filtros' : 'Filtrar conciliaciones' }}
    </button>
    <a class="btn navigate" routerLink="../gestionar-ajuste-de-inventario">Crear conciliación</a>
  </div>
</div>

@if (showFilters()) {
  <form class="box mb-2" [formGroup]="filterForm" (ngSubmit)="applyFilters()">
    <app-create-conditional-box formName="Filtrar conciliaciones">
      <app-search-select class="col-md-3" placeholder="Producto"
        [items]="references.products()" displayField="nombre" valueField="idProducto" [showAll]="true"
        [value]="filterForm.controls.productId.value" [selectedItem]="selectedProduct()"
        (search)="references.loadProducts($event)" (selected)="selectProduct($event)" />
      <app-search-select class="col-md-3" placeholder="Recinto"
        [items]="filteredCampuses()" [initialItems]="references.campuses()"
        displayField="nombre" valueField="idRecinto" [showAll]="true"
        [value]="filterForm.controls.campusId.value" [selectedItem]="selectedCampus()"
        (search)="campusSearch.set($event)" (selected)="selectCampus($event)" />
      <app-search-select class="col-md-3" placeholder="Almacén"
        [items]="references.warehouses()" displayField="nombre" valueField="idTipoAlm" [showAll]="true"
        [value]="filterForm.controls.warehouseId.value" [selectedItem]="selectedWarehouse()"
        (search)="references.loadWarehouses($event)" (selected)="selectWarehouse($event)" />
      <div class="col-md-3 form-floating">
        <input id="filter-count-number" type="text" placeholder="Número de toma física"
          class="form-control" formControlName="countNumber" />
        <label for="filter-count-number">Número de toma física</label>
      </div>
      <app-form-actions nameActionBoton="Filtrar" iconActionBoton="bi bi-search"
        [editing]="filterForm.dirty" [disabled]="!filterForm.dirty || facade.loading() || loading()"
        (clear)="clearFilters()" />
    </app-create-conditional-box>
  </form>
}

<div class="box" [attr.aria-busy]="facade.loading()">
  <app-table-of-content tableTitle="Listado de conciliaciones"
    [tableData]="rows()" [tableColumns]="tableColumns" trackByField="id"
    [showDetail]="true" [showPagination]="true" [showTotal]="facade.totalItems() !== null"
    [totalItems]="facade.pagination().totalItems" [totalPages]="facade.pagination().totalPages"
    [currentPage]="facade.pagination().currentPage" [pageSize]="facade.pagination().pageSize"
    (pageChange)="!facade.loading() && facade.changePage($event)"
    (pageSizeChange)="!facade.loading() && facade.changePageSize($event)"
    (edit)="facade.edit($event.row.id)" (remove)="facade.remove($event.row.id)"
    (showDialog)="openDetail($event.id)" />
</div>
