<div class="title">
  <h1>Ordenes de compra</h1>

  <span class="d-flex gap-1">
    <button class="btn navigate" (click)="this.filteringProduct = !this.filteringProduct;">
      {{ filteringProduct ? 'Ocultar filtros' : 'Filtrar productos' }}
    </button>

    <button class="btn navigate"  [routerLink]="['../gestionar-ordenes-de-compra']"> Gestionar orden de compra </button>
  </span>
</div>

<div class="box">
    <!-- (showDialog)="openDialog($event)" -->
  <app-table-of-content
    [showDetail]="true"
    [tableTitle]="'Listado de ordenes de compra'"
    [trackByField]="'idOrden'"
    [tableData]="data()?.data || []"
    [tableColumns]="tableColums"
    [totalItems]="pagination().totalItems"
    [showPagination]="true"
    [totalPages]="pagination().totalPages"
    [currentPage]="pagination().currentPage"
    [pageSize]="pagination().pageSize"
    (pageChange)="changePage($event)"
    (pageSizeChange)="changePageSize($event)"
    (remove)="remove($event.idOrden)"
    ></app-table-of-content>
    <!-- (edit)="setProduct($event)" -->
</div>
