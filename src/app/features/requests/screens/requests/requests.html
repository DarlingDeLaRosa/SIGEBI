<div class="title">
  <h1>Solicitudes</h1>

  <span class="d-flex gap-1">
    <button
      class="btn navigate"
      (click)="this.filteringRequests.set(!this.filteringRequests())"
    >
      {{ filteringRequests() ? 'Ocultar filtros' : 'Filtrar solicitudes' }}
    </button>

    <button class="btn navigate" [routerLink]="['../gestionar-solicitudes']">
      Crear solicitud
    </button>
  </span>
</div>

@if (filteringRequests()) {
  <form [formGroup]="filterForm" (ngSubmit)="applyFilters()" class="box mb-2">
    <app-create-conditional-box [formName]="'Filtrar solicitudes'">
      <div class="col-md-4 form-floating">
        <input id="noRequerimiento" type="text" formControlName="noRequerimiento" class="form-control" placeholder="Número de requerimiento" />
        <label for="noRequerimiento">Número de requerimiento</label>
      </div>
      <app-search-select class="col-md-4" placeholder="Estado de solicitud"
        [items]="facade.filteredStatus()" [initialItems]="facade.status()"
        displayField="nombre" valueField="id" [showAll]="true"
        [value]="filterForm.controls.idEstadoSolicitud.value" [selectedItem]="facade.filterSelections.status()"
        (search)="facade.statusSearch.set($event)"
        (selected)="selectFilter(facade.filterSelections.status, 'idEstadoSolicitud', $event, 'id')" />
      <app-search-select class="col-md-4" placeholder="Tipo de artículo"
        [items]="facade.articleTypes()" [initialItems]="facade.articleTypes()"
        displayField="nombre" valueField="idTipoArt" [showAll]="true"
        [value]="filterForm.controls.idTipoArticulo.value" [selectedItem]="facade.filterSelections.articleType()"
        (search)="facade.loadArticleTypes($event)"
        (selected)="selectFilter(facade.filterSelections.articleType, 'idTipoArticulo', $event, 'idTipoArt')" />
      <app-search-select class="col-md-4" placeholder="Tipo de solicitud"
        [items]="facade.filteredRequestTypes()" [initialItems]="facade.requestTypes()"
        displayField="nombre" valueField="id" [showAll]="true"
        [value]="filterForm.controls.idTipoSolicitud.value" [selectedItem]="facade.filterSelections.requestType()"
        (search)="facade.requestTypeSearch.set($event)"
        (selected)="selectFilter(facade.filterSelections.requestType, 'idTipoSolicitud', $event, 'id')" />
      <div class="col-md-4 form-floating">
        <input id="unidadOrganizativa" type="text" formControlName="unidadOrganizativa" class="form-control" placeholder="Unidad organizativa" />
        <label for="unidadOrganizativa">Unidad organizativa</label>
      </div>
      <app-search-select class="col-md-4" placeholder="Recinto"
        [items]="facade.filteredCampuses()" [initialItems]="facade.campuses()"
        displayField="nombre" valueField="idRecinto" [showAll]="true"
        [value]="filterForm.controls.idRecinto.value" [selectedItem]="facade.filterSelections.campus()"
        (search)="facade.campusSearch.set($event)"
        (selected)="selectFilter(facade.filterSelections.campus, 'idRecinto', $event, 'idRecinto')" />
      <app-form-actions nameActionBoton="Filtrar" iconActionBoton="bi bi-search"
        [editing]="true" [disabled]="loading()" (clear)="clearForm()" />
    </app-create-conditional-box>
  </form>
}
<div class="box">
  <app-table-of-content
    [showDetail]="true"
    [actions]="facade.actions"
    [tableTitle]="'Listado de solicitudes'"
    [trackByField]="'id'"
    [tableData]="data()?.data || []"
    [tableColumns]="tableColumns"
    [totalItems]="pagination().totalItems"
    [showPagination]="true"
    [showTotal]="false"
    [totalPages]="pagination().totalPages"
    [currentPage]="pagination().currentPage"
    [pageSize]="pagination().pageSize"
    (pageChange)="changePage($event)"
    (pageSizeChange)="changePageSize($event)"
    (showDialog)="facade.openDialog($event.id)"
    (remove)="remove($event.row.id)"
  ></app-table-of-content>
    <!-- (edit)="facade.editPurchaseContract($event.row.id)" -->
</div>
